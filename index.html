<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikah Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1420;
    --bg-deep: #130E17;
    --bg-card: #241B29;
    --bg-card-hover: #2C2130;
    --paper: #F3E7D3;
    --ink: #2A1B12;
    --emerald: #9C3F2E;
    --emerald-dim: #7C3324;
    --gold: #C9A24B;
    --gold-dim: #A9843A;
    --rose: #C0564A;
    --text: #EDE3D6;
    --text-dim: #A0927F;
    --border: rgba(237,227,214,0.10);
    --border-strong: rgba(237,227,214,0.20);
    --on-accent: #F8F1E4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ font-family:'Jost', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; } button{ font-family:inherit; }
  ::selection{ background:var(--gold); color:var(--ink); }

  #app-shell{ display:none; min-height:100vh; }
  #auth-shell{ display:none; min-height:100vh; }
  #app-shell.show, #auth-shell.show{ display:flex; }

  .sidebar{ width:240px; min-width:240px; background:var(--bg-deep); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:24px 16px; overflow-y:auto; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; padding:0 6px; }
  .brand-mark{ width:34px; height:34px; border-radius:10px; background:linear-gradient(160deg, var(--gold), var(--gold-dim)); display:flex; align-items:center; justify-content:center; font-family:'Markazi Text', serif; font-weight:700; font-size:18px; color:var(--on-accent); flex-shrink:0; }
  .brand-text{ font-family:'Markazi Text', serif; font-size:19px; font-weight:700; line-height:1.1; }
  .brand-text span{ display:block; font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:500; color:var(--text-dim); letter-spacing:1.5px; text-transform:uppercase; margin-top:3px; }
  nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; color:var(--text-dim); cursor:pointer; font-size:13.5px; font-weight:500; transition:background .15s, color .15s; border:none; background:none; text-align:left; width:100%; font-family:inherit; }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background:var(--bg-card); color:var(--text); }
  .nav-item.active{ background:var(--bg-card); color:var(--emerald); }
  .nav-item.active svg{ opacity:1; }
  .sidebar-foot{ margin-top:auto; padding:14px 12px 4px; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); line-height:1.5; }
  .me-badge{ background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:12.5px; }
  .me-badge strong{ display:block; font-size:13.5px; margin-bottom:2px; }
  .logout-link{ color:var(--rose); cursor:pointer; font-size:12px; font-weight:600; margin-top:8px; display:inline-block; }

  main{ flex:1; overflow-y:auto; height:100vh; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 40px 0; flex-wrap:wrap; gap:12px; }
  .page-title{ font-family:'Markazi Text', serif; font-size:28px; font-weight:700; }
  .page-sub{ font-size:13px; color:var(--text-dim); margin-top:4px; }
  .content{ padding:24px 40px 60px; }

  .panel{ background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:22px; margin-bottom:20px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .panel-title{ font-family:'Markazi Text', serif; font-size:18px; font-weight:700; }
  .panel-sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px; }

  .btn{ display:inline-flex; align-items:center; gap:7px; background:var(--emerald); color:var(--on-accent); border:none; padding:9px 18px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer; transition:background .15s, transform .1s; }
  .btn:hover{ background:var(--emerald-dim); }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-gold{ background:var(--gold); color:var(--ink); }
  .btn-gold:hover{ background:var(--gold-dim); }
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--border-strong); }
  .btn-ghost:hover{ background:var(--bg-card-hover); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-danger{ background:transparent; color:var(--rose); border:1px solid rgba(192,86,74,0.4); }
  .btn-danger:hover{ background:rgba(192,86,74,0.1); }
  .btn-block{ width:100%; justify-content:center; }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px; }
  .profile-card{ background:var(--paper); color:var(--ink); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 14px 34px rgba(0,0,0,0.38); position:relative; }
  .profile-photo{ height:150px; background:linear-gradient(135deg, #E6D3B4, var(--paper)); display:flex; align-items:center; justify-content:center; position:relative; }
  .profile-photo svg{ width:48px; height:48px; color:rgba(42,27,18,0.35); }
  .profile-photo img{ width:100%; height:100%; object-fit:cover; }
  .profile-seal{ position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; background:linear-gradient(160deg, var(--gold), var(--gold-dim)); display:flex; align-items:center; justify-content:center; font-family:'Markazi Text', serif; font-weight:700; font-size:13px; color:var(--on-accent); box-shadow:0 3px 8px rgba(0,0,0,0.3); }
  .profile-lock{ position:absolute; bottom:8px; right:8px; background:rgba(42,27,18,0.72); color:#fff; font-size:10px; padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:4px; }
  .profile-body{ padding:16px 16px 14px; flex:1; display:flex; flex-direction:column; color:var(--ink); }
  .profile-name{ font-family:'Markazi Text', serif; font-weight:700; font-size:19px; color:var(--ink); }
  .profile-meta{ font-size:12px; color:rgba(42,27,18,0.58); margin:3px 0 10px; }
  .profile-desc{ font-size:12.5px; color:rgba(42,27,18,0.85); line-height:1.5; margin-bottom:14px; flex:1; }
  .profile-actions{ display:flex; gap:8px; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td{ padding:12px 10px; font-size:13px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill-green{ background:rgba(156,63,46,0.12); color:var(--emerald); }
  .pill-rose{ background:rgba(192,86,74,0.12); color:var(--rose); }
  .pill-gold{ background:rgba(201,162,75,0.16); color:var(--gold-dim); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--text-dim); padding:4px; border-radius:5px; display:flex; }
  .icon-btn:hover{ color:var(--text); background:var(--bg-card-hover); }
  .icon-btn svg{ width:15px; height:15px; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); }
  .empty-state svg{ width:38px; height:38px; opacity:0.4; margin-bottom:12px; }
  .empty-state p{ font-size:13.5px; max-width:360px; margin:0 auto; }

  .overlay{ position:fixed; inset:0; background:rgba(19,14,23,0.55); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; overflow-y:auto; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--bg-card); border:1px solid var(--border-strong); border-radius:14px; width:100%; max-width:480px; padding:26px; max-height:88vh; overflow-y:auto; }
  .modal-title{ font-family:'Markazi Text', serif; font-size:19px; font-weight:700; margin-bottom:18px; }
  .modal-section{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--gold-dim); font-weight:700; margin:18px 0 10px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
  .field input, .field select, .field textarea{ width:100%; background:var(--bg-deep); border:1px solid var(--border-strong); color:var(--text); padding:9px 11px; border-radius:8px; font-family:inherit; font-size:13.5px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--gold); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-hint{ font-size:11.5px; color:var(--text-dim); margin-top:5px; }
  .field-checkbox{ display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--text); margin-bottom:14px; }
  .field-checkbox input{ margin-top:3px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; justify-content:flex-end; flex-wrap:wrap; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); border:1px solid var(--border-strong); color:#fff; padding:11px 20px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:200; display:flex; align-items:center; gap:8px; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast-dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); }
  select option{ background:var(--bg-deep); }

  .auth-nav{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:22px 40px; max-width:1100px; }
  .auth-nav-actions{ display:flex; gap:10px; align-items:center; }
  .auth-nav-link{ font-size:13px; color:var(--text-dim); cursor:pointer; font-weight:500; }
  .auth-nav-link:hover{ color:var(--text); }
  .hero{ width:100%; max-width:1100px; padding:50px 40px 20px; text-align:center; }
  .hero-eyebrow{ display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dim); border:1px solid rgba(201,162,75,0.4); border-radius:20px; padding:5px 14px; margin-bottom:22px; }
  .hero-title{ font-family:'Markazi Text', serif; font-size:44px; font-weight:700; line-height:1.18; margin-bottom:18px; }
  .hero-title em{ font-style:normal; color:var(--emerald); }
  .hero-sub{ font-size:16px; color:var(--text-dim); max-width:560px; margin:0 auto 30px; line-height:1.6; }
  .hero-ctas{ display:flex; gap:14px; justify-content:center; margin-bottom:50px; flex-wrap:wrap; }
  .btn-lg{ padding:13px 26px; font-size:14.5px; }
  .features{ width:100%; max-width:1100px; padding:0 40px 60px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .feature-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:22px 20px; }
  .feature-icon{ width:38px; height:38px; border-radius:10px; background:rgba(156,63,46,0.10); color:var(--emerald); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .feature-icon svg{ width:19px; height:19px; }
  .feature-title{ font-weight:700; font-size:14.5px; margin-bottom:6px; }
  .feature-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.5; }
  .auth-card-wrap{ width:100%; max-width:1100px; padding:40px; display:flex; justify-content:center; flex:1; align-items:flex-start; }
  .auth-card{ background:var(--bg-card); border:1px solid var(--border-strong); border-radius:16px; padding:34px 34px 30px; width:100%; max-width:480px; }
  .auth-card-title{ font-family:'Markazi Text', serif; font-size:22px; font-weight:700; margin-bottom:6px; }
  .auth-card-sub{ font-size:13px; color:var(--text-dim); margin-bottom:24px; line-height:1.5; }
  .auth-switch{ text-align:center; font-size:12.5px; color:var(--text-dim); margin-top:18px; }
  .auth-switch a{ color:var(--emerald); cursor:pointer; font-weight:600; }
  .auth-error{ background:rgba(192,86,74,0.1); border:1px solid rgba(192,86,74,0.3); color:var(--rose); font-size:12.5px; padding:10px 13px; border-radius:9px; margin-bottom:16px; }
  .auth-info{ background:rgba(156,63,46,0.1); border:1px solid rgba(156,63,46,0.3); color:var(--emerald); font-size:12.5px; padding:10px 13px; border-radius:9px; margin-bottom:16px; }
  .status-icon-wrap{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
  .status-icon-wrap svg{ width:26px; height:26px; }
  .center-page{ flex:1; display:flex; align-items:center; justify-content:center; width:100%; padding:40px; }
  .subtle-admin-link{ font-size:11.5px; color:var(--text-dim); opacity:0.6; margin-top:30px; }
  .subtle-admin-link:hover{ opacity:1; }
  .quota-banner{ background:rgba(201,162,75,0.14); border:1px solid rgba(201,162,75,0.35); color:var(--gold-dim); padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .quota-blocked{ background:rgba(192,86,74,0.1); border:1px solid rgba(192,86,74,0.3); color:var(--rose); padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:14px; }
  .tabs{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tab-btn{ background:none; border:none; color:var(--text-dim); padding:10px 4px; font-size:13.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; margin-right:18px; }
  .tab-btn.active{ color:var(--emerald); border-bottom-color:var(--emerald); }
  .count-badge{ background:var(--gold); color:var(--ink); font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 7px; margin-left:6px; }

  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:flex-end; }
  .filter-bar .field{ margin-bottom:0; min-width:140px; }

  .conv-list{ display:flex; flex-direction:column; gap:8px; }
  .conv-item{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; cursor:pointer; border:1px solid var(--border); }
  .conv-item:hover{ background:var(--bg-card-hover); }
  .conv-item.active{ background:rgba(156,63,46,0.08); border-color:var(--emerald); }
  .conv-avatar{ width:40px; height:40px; border-radius:50%; background:var(--bg-deep); display:flex; align-items:center; justify-content:center; font-family:'Markazi Text', serif; font-weight:700; color:var(--text-dim); flex-shrink:0; }
  .conv-name{ font-weight:700; font-size:13.5px; }
  .conv-preview{ font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }

  .chat-wrap{ display:flex; gap:20px; height:calc(100vh - 220px); min-height:420px; }
  .chat-list-col{ width:280px; min-width:280px; overflow-y:auto; }
  .chat-main{ flex:1; display:flex; flex-direction:column; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .chat-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .chat-messages{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg-bubble{ max-width:70%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5; }
  .msg-mine{ align-self:flex-end; background:var(--emerald); color:var(--on-accent); border-bottom-right-radius:4px; }
  .msg-theirs{ align-self:flex-start; background:var(--bg-deep); color:var(--text); border-bottom-left-radius:4px; }
  .chat-input-row{ display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--border); }
  .chat-input-row input{ flex:1; background:var(--bg-deep); border:1px solid var(--border-strong); color:var(--text); padding:10px 13px; border-radius:9px; font-family:inherit; font-size:13.5px; }
  .chat-input-row input:focus{ outline:none; border-color:var(--gold); }

  @media (max-width: 880px){
    .sidebar{ width:76px; min-width:76px; padding:20px 10px; }
    .brand-text, .nav-item span, .me-badge{ display:none; }
    .nav-item{ justify-content:center; }
    .content, .topbar{ padding-left:18px; padding-right:18px; }
    .field-row{ grid-template-columns:1fr; }
    .features{ grid-template-columns:1fr; }
    .hero-title{ font-size:32px; }
    .auth-nav{ padding:18px 20px; }
    .hero{ padding-left:20px; padding-right:20px; }
    .chat-wrap{ flex-direction:column; height:auto; }
    .chat-list-col{ width:100%; }
  }
</style>
</head>
<body>

<div id="auth-shell"><div id="auth-content" style="width:100%; display:flex; flex-direction:column; align-items:center; flex:1;"></div></div>

<div id="app-shell">
  <div class="sidebar">
    <div class="brand"><div class="brand-mark">ن</div><div class="brand-text">Nikah Connect<span>Rencontre pour le mariage</span></div></div>
    <div class="me-badge" id="me-badge"></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="logout-link" onclick="logout()">Se déconnecter</div>
    </div>
  </div>
  <main>
    <div class="topbar">
      <div><div class="page-title" id="page-title">Découvrir</div><div class="page-sub" id="page-sub">Des profils sérieux, en vue du mariage</div></div>
      <div id="topbar-action"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="admin-shell" style="display:none; min-height:100vh; width:100%;">
  <div style="max-width:1100px; margin:0 auto; width:100%; padding:30px 30px 60px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="brand-mark">ن</div>
        <div><div class="page-title" style="font-size:22px;">Espace Modération</div><div class="page-sub">Validation des profils, signalements, paiements</div></div>
      </div>
      <div class="logout-link" onclick="logout()">Se déconnecter</div>
    </div>
    <div id="admin-content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"><span class="toast-dot"></span><span id="toast-text"></span></div>

<script>
/* ============================================================
   SAKINA — plateforme de mise en relation matrimoniale
   ============================================================ */
const MIN_AGE = 18;
const PACKS = {
  pack20: { label: "20 messages", price: 2000, messages: 20 },
  pack50: { label: "50 messages", price: 4000, messages: 50 },
  illimite: { label: "Illimité (30 jours)", price: 7000, messages: null, days: 30 },
};
const PAYMENT_NUMBER = "77 041 66 54";
const VILLES = ["Dakar","Thiès","Touba","Saint-Louis","Kaolack","Ziguinchor","Rufisque","Mbour","Diourbel","Louga","Autre"];

let currentUser = null; // profil complet de l'utilisateur connecté (jamais de mot de passe)
let adminUsers = []; // pour l'espace modération
let discoverResults = [];
let interetsRecus = [];
let interetsEnvoyes = [];
let matchesList = [];
let activeConv = null; // { profile, messages }

let session = null; // { type:'user', token } ou { type:'admin', token }
const SESSION_KEY = 'nikah-connect-session';
function persistSession(){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){} }
function readPersistedSession(){ try{ const raw = localStorage.getItem(SESSION_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function clearPersistedSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

let currentPage = 'decouvrir';
let authView = 'landing';
let authError = '';
let authInfo = '';
let activeConvUserId = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function ageFromDate(dateStr){
  const b = new Date(dateStr); const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && t.getDate() < b.getDate())) age--;
  return age;
}
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){ return new Intl.NumberFormat('fr-FR').format(n||0) + ' FCFA'; }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}); }
function showToast(text){
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
function openModal(){ document.getElementById('overlay').classList.add('open'); }

/* ============ APPELS API ============ */
async function callApi(endpoint, action, extra={}){
  const res = await fetch(`/api/${endpoint}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, token: session?.token, ...extra }),
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  return { ok: res.ok, status: res.status, data };
}
async function refreshCurrentUser(){
  const { ok, data } = await callApi('auth', 'me');
  if(ok) currentUser = data.user;
  return ok;
}

function showShell(name){
  document.getElementById('auth-shell').classList.remove('show');
  document.getElementById('app-shell').classList.remove('show');
  document.getElementById('admin-shell').style.display = 'none';
  if(name==='auth') document.getElementById('auth-shell').classList.add('show');
  if(name==='app') document.getElementById('app-shell').classList.add('show');
  if(name==='admin') document.getElementById('admin-shell').style.display='block';
}
function goAuth(v){ authView=v; authError=''; authInfo=''; renderAuth(); }
async function logout(){
  session = null; currentUser = null; activeConvUserId = null;
  clearPersistedSession();
  goAuth('landing');
}

  else if(authView==='rejected') c.innerHTML = tplStatus('rejected');
  else if(authView==='suspended') c.innerHTML = tplStatus('suspended');
}

async function submitSignup(){
  const prenom = document.getElementById('s-prenom').value.trim();
  const genre = document.getElementById('s-genre').value;
  const naissance = document.getElementById('s-naissance').value;
  const ville = document.getElementById('s-ville').value;
  const statutMatrimonial = document.getElementById('s-statut').value;
  const niveauPratique = document.getElementById('s-pratique').value;
  const description = document.getElementById('s-desc').value.trim();
  const recherche = document.getElementById('s-recherche').value.trim();
  const waliNom = document.getElementById('s-wali-nom').value.trim();
  const waliContact = document.getElementById('s-wali-contact').value.trim();
  const waliEmail = document.getElementById('s-wali-email').value.trim();
  const waliVisibiliteMessages = document.getElementById('s-wali-visible').checked;
  const email = document.getElementById('s-email').value.trim().toLowerCase();
  const pw = document.getElementById('s-pw').value;
  const pw2 = document.getElementById('s-pw2').value;
  const majeurConfirme = document.getElementById('s-majeur').checked;

  if(!prenom || !naissance || !email || !pw){ authError='Merci de remplir tous les champs obligatoires.'; renderAuth(); return; }
  if(pw.length < 8){ authError='Le mot de passe doit contenir au moins 8 caractères.'; renderAuth(); return; }
  if(pw !== pw2){ authError='Les mots de passe ne correspondent pas.'; renderAuth(); return; }

  const { ok, data } = await callApi('auth', 'signup', {
    prenom, genre, dateNaissance: naissance, ville, statutMatrimonial, niveauPratique,
    description, recherche, waliNom, waliContact, waliEmail, waliVisibiliteMessages,
    email, password: pw, majeurConfirme,
  });
  if(!ok){ authError = data.error || "Erreur lors de l'inscription."; renderAuth(); return; }
  goAuth('pending');
}

async function submitLogin(){
  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pw = document.getElementById('l-pw').value;
  if(!email || !pw){ authError='Merci de renseigner votre email et mot de passe.'; renderAuth(); return; }
  const { ok, data } = await callApi('auth', 'login', { email, password: pw });
  if(data.status === 'pending'){ goAuth('pending'); return; }
  if(data.status === 'rejected'){ goAuth('rejected'); return; }
  if(data.status === 'suspended'){ goAuth('suspended'); return; }
  if(!ok){ authError = data.error || 'Erreur de connexion.'; renderAuth(); return; }
  session = { type:'user', token: data.token };
  currentUser = data.user;
  persistSession();
  currentPage = 'decouvrir';
  showShell('app'); render();
}

async function rejectUser(id){ if(!confirm('Rejeter ce profil ?')) return; await callApi('auth','admin-reject',{userId:id}); await renderAdmin(); showToast('Profil rejeté'); }

  await callApi('auth','admin-suspend',{userId:id});

async function resolveReport(id){ await callApi('matching','admin-resolve-report',{reportId:id}); await renderAdmin(); showToast('Signalement traité'); }
async function confirmTopup(id){ await callApi('messaging','admin-confirm-topup',{topupId:id}); await renderAdmin(); showToast('Paiement confirmé'); }
async function rejectTopup(id){ await callApi('messaging','admin-reject-topup',{topupId:id}); await renderAdmin(); showToast('Paiement rejeté'); }
async function changeAdminPw(){

function renderNav(){
  const nav = document.getElementById('nav');

  document.getElementById('page-sub').textContent = pageMeta[page][1];

function meBadgeHtml(u){ return `<strong>${escapeHtml(u.prenom)}</strong>${escapeHtml(u.ville)} · ${ageFromDate(u.dateNaissance)} ans`; }

async function render(){
  const ok = await refreshCurrentUser();
  if(!ok){ logout(); return; }
  const u = currentUser;
  document.getElementById('me-badge').innerHTML = meBadgeHtml(u);
  if(currentPage==='interets'){
    const { data } = await callApi('matching','list-interests');
    interetsRecus = data.recus || []; interetsEnvoyes = data.envoyes || [];
  }
  renderNav();
  if(currentPage==='decouvrir') await renderDecouvrir();
  else if(currentPage==='interets') renderInterets();
  else if(currentPage==='messages') await renderMessages();
  else if(currentPage==='profil') renderProfil(u);
}

/* ---------- DÉCOUVRIR ---------- */
let filterVille = '';
let filterAgeMin = 18;
let filterAgeMax = 60;
async function renderDecouvrir(){
  document.getElementById('topbar-action').innerHTML = '';
  const { data } = await callApi('matching','discover',{ ville: filterVille, ageMin: filterAgeMin, ageMax: filterAgeMax });
  discoverResults = data.profiles || [];
  const villesOpt = VILLES.map(v=>`<option value="${v}" ${filterVille===v?'selected':''}>${v}</option>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="filter-bar">
      <div class="field"><label>Ville</label><select id="f-ville" onchange="filterVille=this.value; renderDecouvrir()"><option value="">Toutes</option>${villesOpt}</select></div>
      <div class="field"><label>Âge min</label><input type="number" id="f-age-min" value="${filterAgeMin}" style="width:80px;" onchange="filterAgeMin=Number(this.value)||18; renderDecouvrir()"></div>
      <div class="field"><label>Âge max</label><input type="number" id="f-age-max" value="${filterAgeMax}" style="width:80px;" onchange="filterAgeMax=Number(this.value)||60; renderDecouvrir()"></div>
    </div>
    ${discoverResults.length ? `<div class="grid-cards">${discoverResults.map(profileCard).join('')}</div>` : emptyState("Aucun profil pour l'instant", 'Reviens un peu plus tard, ou élargis tes filtres.')}
  `;
}

      <div class="profile-seal">${escapeHtml((o.prenom||'?')[0])}</div>
      ${!o.matched ? `<div class="profile-lock"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Photo protégée</div>` : ''}
    </div>

      <div class="profile-name">${escapeHtml(o.prenom)}, ${ageFromDate(o.dateNaissance)} ans</div>

        <button class="icon-btn" title="Bloquer" onclick="blockUser('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg></button>

async function sendInterest(toId){
  const { ok, data } = await callApi('matching','send-interest',{toUserId:toId});
  if(!ok){ showToast(data.error||'Erreur'); return; }
  await renderDecouvrir(); showToast('Intérêt envoyé');

function openReportModal(id){
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-title">Signaler ce profil</div>
    <div class="field"><label>Motif</label><select id="rep-motif">
      <option value="faux_profil">Faux profil / usurpation</option>

    <div class="field"><label>Détails (optionnel)</label><textarea id="rep-details" placeholder="Expliquez brièvement..."></textarea></div>

async function submitReport(reportedId){

/* ---------- MES INTÉRÊTS ---------- */

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Intérêts reçus</div></div>

async function respondInterest(id, accepted){
  await callApi('matching','respond-interest',{interestId:id, accepted});

/* ---------- MESSAGES ---------- */
async function renderMessages(){
  document.getElementById('topbar-action').innerHTML = '';
  const { data } = await callApi('messaging','list-matches');
  matchesList = data.matches || [];
  const quotaMessages = data.quotaMessages, quotaUnlimitedUntil = data.quotaUnlimitedUntil;
  if(!activeConvUserId && matchesList.length) activeConvUserId = matchesList[0].profile.id;
  const quotaLeft = (quotaUnlimitedUntil && quotaUnlimitedUntil>=todayStr()) ? '∞' : (quotaMessages||0);

  document.getElementById('content').innerHTML = `
    <div class="quota-banner">Messages restants : <strong>${quotaLeft}</strong> ${quotaLeft!=='∞'?'ce mois-ci':''} <button class="btn btn-sm btn-gold" onclick="openTopupModal()">Acheter des messages</button></div>
    <div class="chat-wrap">
      <div class="chat-list-col conv-list">
        ${matchesList.length ? matchesList.map(m=>{
          const o = m.profile;
          return `<div class="conv-item ${o.id===activeConvUserId?'active':''}" onclick="activeConvUserId='${o.id}'; renderMessages()">
            <div class="conv-avatar">${escapeHtml((o.prenom||'?')[0])}</div>
            <div style="flex:1; min-width:0;"><div class="conv-name">${escapeHtml(o.prenom)}</div><div class="conv-preview">${m.lastMessage?escapeHtml(m.lastMessage):'Dites bonjour !'}</div></div>
          </div>`;
        }).join('') : `<div class="empty-state" style="padding:20px;"><p>Aucune conversation pour l'instant. Elle s'ouvrira dès qu'un intérêt sera accepté.</p></div>`}
      </div>
      <div class="chat-main" id="chat-main-col">Chargement…</div>
    </div>
  `;
  if(activeConvUserId){
    const o = matchesList.find(m=>m.profile.id===activeConvUserId)?.profile;
    await renderChatMain(o, quotaLeft);
  } else {
    document.getElementById('chat-main-col').innerHTML = `<div class="empty-state" style="margin:auto;"><p>Sélectionnez une conversation.</p></div>`;
  }
}
async function renderChatMain(o, quotaLeft){
  const col = document.getElementById('chat-main-col');
  if(!o){ col.innerHTML = `<div class="empty-state" style="margin:auto;"><p>Conversation introuvable.</p></div>`; return; }
  const { data } = await callApi('messaging','get-conversation',{otherId:o.id});
  const conv = data.messages || [];
  const quotaOk = quotaLeft==='∞' || quotaLeft > 0;
  col.innerHTML = `
    <div class="chat-head">
      <div><strong>${escapeHtml(o.prenom)}</strong> <span style="font-size:12px; color:var(--text-dim);">· ${escapeHtml(o.ville)}</span></div>
      ${o.waliVisibiliteMessages ? `<span class="pill pill-gold">Tuteur informé</span>` : ''}
    </div>
    <div class="chat-messages" id="chat-scroll">
      ${conv.length ? conv.map(m=> `<div class="msg-bubble ${m.mine?'msg-mine':'msg-theirs'}">${escapeHtml(m.texte)}</div>`).join('') : `<div style="margin:auto; color:var(--text-dim); font-size:13px;">Dites bonjour à ${escapeHtml(o.prenom)} 👋</div>`}
    </div>
    ${quotaOk ? `
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Écrire un message..." onkeydown="if(event.key==='Enter') sendChatMessage('${o.id}')">
        <button class="btn btn-gold" onclick="sendChatMessage('${o.id}')">Envoyer</button>
      </div>
    ` : `<div class="quota-blocked" style="margin:14px;">Votre quota de messages gratuits est épuisé. <a style="color:var(--rose); font-weight:700; cursor:pointer;" onclick="openTopupModal()">Achetez un pack</a> pour continuer à échanger.</div>`}
  `;
  const box = document.getElementById('chat-scroll'); if(box) box.scrollTop = box.scrollHeight;
}
async function sendChatMessage(otherId){
  const input = document.getElementById('chat-input');
  const texte = input.value.trim();
  if(!texte) return;
  const { ok, data } = await callApi('messaging','send-message',{otherId, texte});
  if(!ok){ showToast(data.error==='quota_exceeded' ? 'Quota épuisé' : (data.error||'Erreur')); await renderMessages(); return; }
  await renderMessages();
}
function openTopupModal(){
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-title">Acheter des messages</div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
      ${Object.entries(PACKS).map(([k,p])=>`
        <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:10px; padding:12px 14px;">
          <div><strong>${p.label}</strong><div style="font-size:12px; color:var(--text-dim);">${fmtMoney(p.price)}</div></div>
          <button class="btn btn-sm btn-gold" onclick="openTopupPayModal('${k}')">Choisir</button>
        </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fermer</button></div>
  `;
  openModal();
}
function openTopupPayModal(packKey){
  const p = PACKS[packKey];
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-title">${p.label}</div>
    <div class="field-hint" style="margin-bottom:14px;">Envoyez <strong>${fmtMoney(p.price)}</strong> via Wave ou Orange Money au numéro <strong>${PAYMENT_NUMBER}</strong>, puis renseignez la référence de transaction ci-dessous.</div>
    <div class="field"><label>Référence de transaction</label><input id="topup-ref" placeholder="ex. WAVE-2H8K4L"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-gold" onclick="submitTopup('${packKey}')">Soumettre</button></div>
  `;
  openModal();
}
async function submitTopup(packKey){
  const ref = document.getElementById('topup-ref').value.trim();
  if(!ref){ showToast('La référence est requise'); return; }
  const { ok, data } = await callApi('messaging','request-topup',{packKey, transactionRef:ref});
  if(!ok){ showToast(data.error||'Erreur'); return; }
  closeModal(); showToast('Paiement soumis, en attente de confirmation');
}

function renderProfil(u){
  document.getElementById('topbar-action').innerHTML = '';
  document.getElementById('content').innerHTML = `
    <div class="panel" style="max-width:600px;">
      <div class="modal-section" style="margin-top:0;">Photo de profil</div>
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:18px;">

        </div>
        <div>
          <input type="file" id="photo-file" accept="image/png, image/jpeg, image/webp" style="display:none;" onchange="handlePhotoUpload(this)">

          <div class="field-hint">JPEG, PNG ou WEBP, 4 Mo maximum.</div>

      </div>

      <div class="field"><label>Prénom</label><input id="p-prenom" value="${escapeHtml(u.prenom)}"></div>
      <div class="field-row">
        <div class="field"><label>Ville</label><select id="p-ville">${VILLES.map(v=>`<option value="${v}" ${u.ville===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label>Statut matrimonial</label><select id="p-statut"><option value="celibataire" ${u.statutMatrimonial==='celibataire'?'selected':''}>Célibataire</option><option value="divorce" ${u.statutMatrimonial==='divorce'?'selected':''}>Divorcé(e)</option><option value="veuf" ${u.statutMatrimonial==='veuf'?'selected':''}>Veuf/Veuve</option></select></div>
      </div>

      <div class="field"><label>À propos de vous</label><textarea id="p-desc">${escapeHtml(u.description)}</textarea></div>
      <div class="field"><label>Ce que vous recherchez</label><textarea id="p-recherche">${escapeHtml(u.recherche)}</textarea></div>
      <div class="field-checkbox"><input type="checkbox" id="p-photo-visible" ${u.photosVisibles?'checked':''}><label for="p-photo-visible" style="margin:0; text-transform:none; font-weight:400;">Rendre ma photo visible après accord mutuel</label></div>

      <div class="modal-section">Tuteur / Wali</div>
      <div class="field-row">
        <div class="field"><label>Nom</label><input id="p-wali-nom" value="${escapeHtml(u.waliNom||'')}"></div>

      </div>
      <div class="field"><label>Email (pour notification)</label><input id="p-wali-email" type="email" value="${escapeHtml(u.waliEmail||'')}"></div>
      <div class="field-checkbox"><input type="checkbox" id="p-wali-visible" ${u.waliVisibiliteMessages?'checked':''}><label for="p-wali-visible" style="margin:0; text-transform:none; font-weight:400;">Informer mon tuteur lorsqu'un accord mutuel est établi</label></div>

      <button class="btn btn-gold" onclick="saveProfil()">Enregistrer</button>

async function handlePhotoUpload(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 4*1024*1024){ showToast("L'image dépasse 4 Mo"); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(',')[1];
    showToast('Envoi de la photo…');
    const { ok, data } = await callApi('profile','upload-photo',{ imageBase64: base64, mimeType: file.type });
    if(!ok){ showToast(data.error||"Échec de l'envoi"); return; }
    await refreshCurrentUser();
    renderProfil(currentUser);
    showToast('Photo mise à jour');
  };
  reader.readAsDataURL(file);
}
async function saveProfil(){
  const fields = {
    prenom: document.getElementById('p-prenom').value.trim(),
    ville: document.getElementById('p-ville').value,
    statutMatrimonial: document.getElementById('p-statut').value,
    niveauPratique: document.getElementById('p-pratique').value,
    description: document.getElementById('p-desc').value.trim(),
    recherche: document.getElementById('p-recherche').value.trim(),
    photosVisibles: document.getElementById('p-photo-visible').checked,
    waliNom: document.getElementById('p-wali-nom').value.trim(),
    waliContact: document.getElementById('p-wali-contact').value.trim(),
    waliEmail: document.getElementById('p-wali-email').value.trim(),
    waliVisibiliteMessages: document.getElementById('p-wali-visible').checked,
  };
  const { ok, data } = await callApi('profile','update', fields);
  if(!ok){ showToast(data.error||'Erreur'); return; }
  currentUser = data.user;
  document.getElementById('me-badge').innerHTML = meBadgeHtml(currentUser);
  showToast('Profil mis à jour');
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  const saved = readPersistedSession();
  if(saved && saved.token){
    session = saved;
    if(saved.type === 'admin'){
      const { data } = await callApi('auth','verify');
      if(data.valid && data.role === 'platform-admin'){ showShell('admin'); renderAdmin(); return; }
    } else if(saved.type === 'user'){
      const { ok, data } = await callApi('auth','me');
      if(ok){
        currentUser = data.user;
        currentPage = 'decouvrir';
        showShell('app'); render();
        return;
      }
    }
    clearPersistedSession(); session = null;
  }
  goAuth('landing');
})();
</script>
